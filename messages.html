<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages | DiskarTasks</title>
  <meta name="description" content="Chat with SLSU students about your gigs and orders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="brand/favicon.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/pages.css">
<script>try{if(localStorage.getItem('campusgigs.v1.theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<main id="main">
  <div class="container messages-page">
    <h1 class="sr-only">Messages</h1>
    <div class="messages" id="messages">
      <aside class="convo-list" aria-label="Conversations">
        <h2 class="convo-list__title">Messages</h2>
        <div id="convo-list"></div>
      </aside>
      <section class="thread" id="thread" aria-label="Conversation">
        <header class="thread__head" id="thread-head"></header>
        <div class="thread__body" id="thread-body" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form class="composer" id="composer" novalidate>
          <label class="sr-only" for="draft">Write a message</label>
          <textarea class="input composer__input" id="draft" rows="1" maxlength="1000" placeholder="Write a message..."></textarea>
          <button class="btn btn--primary btn--icon" type="submit" id="send" aria-label="Send message" disabled></button>
        </form>
        <p class="composer__note" id="composer-note" hidden></p>
      </section>
    </div>
    <div id="inbox-empty" hidden></div>
  </div>
</main>
<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/messages.js"></script>
</body>
</html>
