<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller | Campus Gigs</title>
  <meta name="description" content="A Campus Gigs seller profile: about, portfolio, gigs and reviews.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/pages.css">
<script>try{if(localStorage.getItem('campusgigs.v1.theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<main id="main">
  <div id="seller-root">
    <div class="profile-cover" id="profile-cover" aria-hidden="true"></div>
    <div class="container">
      <header class="profile-head" id="profile">
        <div class="profile-head__avatar" id="p-avatar"></div>
        <div class="profile-head__id">
          <h1 id="p-handle"></h1>
          <p id="p-headline"></p>
          <p class="seller-meta" id="p-meta"></p>
        </div>
        <div class="profile-head__actions" id="p-actions"></div>
      </header>

      <div id="welcome-slot"></div>

      <div class="profile-layout">
        <nav class="profile-nav" aria-label="Seller sections"><ul id="profile-nav"></ul></nav>
        <div class="profile-main">
          <nav class="tabbar" id="tabbar" aria-label="Profile sections"></nav>

          <section class="profile-section" id="about" aria-labelledby="about-title">
            <h2 id="about-title">About Me</h2>
            <p class="about-bio" id="about-bio"></p>
            <div class="seller-card__chips" id="about-skills"></div>
          </section>

          <section class="profile-section" id="portfolio" aria-labelledby="portfolio-title">
            <div class="section__head"><h2 id="portfolio-title">Portfolio</h2><button class="link-arrow" type="button" id="portfolio-more" hidden>See all <span id="pf-arrow"></span></button></div>
            <div class="portfolio-grid" id="portfolio-grid"></div>
          </section>

          <section class="profile-section" id="gigs" aria-labelledby="gigs-title">
            <h2 id="gigs-title">My Gigs</h2>
            <div class="gig-rows" id="gig-rows"></div>
          </section>

          <section class="profile-section" id="reviews" aria-labelledby="reviews-title">
            <h2 id="reviews-title">Reviews</h2>
            <div id="review-list"></div>
          </section>

          <section class="profile-section" id="orders" aria-labelledby="orders-title" hidden>
            <h2 id="orders-title">Orders received</h2>
            <div class="order-list" id="order-list"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/settings-drawer.js"></script>
<script src="js/pages/seller.js"></script>
</body>
</html>
